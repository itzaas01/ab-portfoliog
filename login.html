<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB Creative Studio Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#000,#111,#1a1a1a);
}

.login-box{
width:350px;
padding:40px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
text-align:center;
color:white;
box-shadow:0 0 30px rgba(255,255,255,0.08);
}

h1{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
outline:none;
border-radius:10px;
background:#222;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:white;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="login-box">
<div class="logo">AB</div>
<h1>Creative Studio</h1>

<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
