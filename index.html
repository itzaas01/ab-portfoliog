<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#000,#111,#1c1c1c);
    height:100vh;
}

/* Background Glow */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at 20% 20%, rgba(255,140,0,.25), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(255,215,0,.2), transparent 30%);
}

/* Character */
.character{
    width:180px;
    height:180px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff8c00,#ffd700);
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    cursor:grab;
    box-shadow:0 0 40px rgba(255,165,0,.5);
    transition:opacity .8s;
}

.character.hidden{
    opacity:0;
    pointer-events:none;
}

/* Portfolio Content */
.portfolio{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    opacity:0;
    transition:1s;
}

.portfolio.show{
    opacity:1;
}

h1{
    font-size:3rem;
}

p{
    margin-top:10px;
    color:#ccc;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="character" id="char">
    🎬
</div>

<div class="portfolio" id="portfolio">
    <h1>Aslam Khan</h1>
    <p>Video Editor & Photographer</p>
</div>

<script>
const char = document.getElementById("char");
const portfolio = document.getElementById("portfolio");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

char.addEventListener("pointerdown",(e)=>{
    isDragging = true;
    offsetX = e.clientX - char.offsetLeft;
    offsetY = e.clientY - char.offsetTop;
});

document.addEventListener("pointermove",(e)=>{
    if(!isDragging) return;

    char.style.left = (e.clientX - offsetX + 90) + "px";
    char.style.top = (e.clientY - offsetY + 90) + "px";
});

document.addEventListener("pointerup",()=>{
    isDragging = false;
});

char.addEventListener("click",()=>{
    char.classList.add("hidden");

    setTimeout(()=>{
        portfolio.classList.add("show");
    },700);
});
</script>

</body>
</html>
